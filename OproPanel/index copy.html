<!doctype html>
<html lang="zh-CN">
<title>顺飞面板</title>

<head>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta charset="utf-8" />
   <script src="./lib/CSInterface.js"></script>
   <script src="./lib/jquery-1.9.1.js"></script>
   <script src="./ext.js"></script>
   <script src="./lib/Vulcan.js"></script>
   <script type="module" src="web-components.js"></script>
   <script type="module" src="fluentplus.js"></script>
   <link id="ppstyle" href="css/style.css" rel="stylesheet" type="text/css" />
   <link rel="stylesheet" href="css/treefl.css">
</head>
<script src="main.js" defer></script>
<script type="module">
   import { baseLayerLuminance, StandardLuminance } from "./web-components.js";

   document.addEventListener("DOMContentLoaded", function () {
      var csInterface = new CSInterface();
      const provider = document.querySelector("fluent-provider");

      // 1. 定义更新主题的函数
      function updateThemeWithAppSkinInfo(appSkinInfo) {
         if (!appSkinInfo || !provider) return;

         // 获取 Premiere 面板的背景 RGB 颜色
         const panelBgColor = appSkinInfo.panelBackgroundColor.color;

         // 将 Adobe 的 RGB 对象转换为 CSS 颜色字符串
         const bgRgb = `rgb(${Math.round(panelBgColor.red)}, ${Math.round(panelBgColor.green)}, ${Math.round(panelBgColor.blue)})`;

         // 计算粗略的亮度值 (0-255) 以判断是深色还是浅色模式
         // Premiere 默认通常是深色，但用户可以调得很亮
         const luminance =
            0.299 * panelBgColor.red +
            0.587 * panelBgColor.green +
            0.114 * panelBgColor.blue;

         // 根据亮度决定 Fluent UI 的模式
         // 128 是中点，小于 128 为暗色，大于为亮色
         if (luminance < 128) {
            baseLayerLuminance.setValueFor(provider, StandardLuminance.DarkMode);
         } else {
            baseLayerLuminance.setValueFor(provider, StandardLuminance.LightMode);
         }

         // 核心：强制 body 的背景色与 Premiere 面板背景色完全一致
         // 这样可以消除 Fluent UI 默认暗色与 Premiere 默认暗色之间的微小色差
         document.body.style.backgroundColor = bgRgb;

         // 如果你的卡片有背景色，也可以在这里动态覆盖，保持无缝融合
         // document.body.style.setProperty('--fill-color', bgRgb);
      }

      // 2. 页面加载时，获取当前的宿主环境颜色并初始化
      const hostEnv = csInterface.getHostEnvironment();
      if (hostEnv && hostEnv.appSkinInfo) {
         updateThemeWithAppSkinInfo(hostEnv.appSkinInfo);
      } else {
         // 如果在浏览器里调试(没有CEP环境)，默认给暗色
         baseLayerLuminance.setValueFor(provider, StandardLuminance.DarkMode);
      }

      // 3. 监听 Premiere Pro 的主题变化事件 (当用户在首选项里拖动滑块时触发)
      csInterface.addEventListener(
         CSInterface.THEME_COLOR_CHANGED_EVENT,
         function () {
            // 重新获取环境信息并更新
            const updatedHostEnv = csInterface.getHostEnvironment();
            if (updatedHostEnv && updatedHostEnv.appSkinInfo) {
               updateThemeWithAppSkinInfo(updatedHostEnv.appSkinInfo);
            }
         },
      );
      document.getElementById('btn_PPRO_Sel').addEventListener('click', () => {
         const cycleLength = document.getElementById('cycleLengthSelect').value;
         const targetIndex = document.getElementById('targetIndexSelect').value;

         // 2. 校验用户是否已经做出了选择
         if (!cycleLength || !targetIndex) {
            alert("请先选择循环次数和目标索引！");
            return;
         }

         // 3. 将变量拼接到字符串中，传给你的 ExtendScript (JSX)
         // 为了防止字符类型导致 JSX 报错，这里用 Number() 明确转成数字
         const jsxCommand = `$._PPP_.selectCustomCycle(${Number(cycleLength)}, ${Number(targetIndex)})`;

         // 4. 调用 CEP 原生的 evalScript 发送给 Premiere
         if (window.__adobe_cep__) {
            // 处于 Premiere CEP 环境中
            csInterface.evalScript(jsxCommand, function (result) {
               // 这里可以接收 JSX 传回来的返回值（如果需要的话）
               console.log("ExtendScript 执行完毕，返回值: ", result);
            });
         } else {
            // 处于普通浏览器环境（本地双击网页测试时）
            console.log("即将发送给宿主的脚本: ", jsxCommand);
            alert("当前不在 Premiere 环境中，脚本命令已打印到控制台: \n" + jsxCommand);
         }
      });

   });
</script>

<body onLoad="onLoaded()">
   <fluent-provider>
      <class="header">

         <div class="card-container" id="titlec">
            <div class="floating">
               <div class="action-block">
                  <fluent-avatar src="./lib/Latia.png" size="64" name="Atlias"></fluent-avatar>
                  <div class="ccb">
                     <p style="font-size: small; margin: 4px 0;">By EllAri </p>
                     <fluent-anchor id="refresh-link" href="javascript:history.go(0)">刷新面板</fluent-anchor>
                  </div>
               </div>
            </div>

            <div class="info-block">
               <p><b>用户:</b> <span id="username">[未初始化]</span></p>
               <p><b>版本:</b> <span id="version_string">[未初始化]</span></p>
               <p><b>当前序列:</b> <span id="active_seq">[未初始化]</span></p>
            </div>
         </div>

         <main class="card-container">
            <fluent-card>
               <div class="card-header">
                  <h2>贝塞尔曲线</h2>
                  <p style="font-size: small">因为我喜欢YTPMV，所以我叫它YTPMV操作</p>
               </div>
               <div class="card-content">
                  <input type="file" id="midiFileInput" accept=".mid,.midi" style="display: none;" />
                  <fluent-button class="controlBg textStyle" onclick="loadMidiNative()">
                     读取 JSON
                  </fluent-button>
                  <script>
                  </script>
                  <fluent-button class="controlBg textStyle"
                     onClick="evalScript('$._PPP_.select1()')">从第一个序列开始选择</fluent-button>
                  <fluent-button class="controlBg textStyle"
                     onClick="evalScript('$._PPP_.select2()')">从第二个序列开始选择</fluent-button>
                  <fluent-button class="controlBg textStyle" id="btn_PPRO_JSON" onclick="tieba()">
                     关注Mizzle吧谢谢喵
                  </fluent-button>
               </div>
            </fluent-card>
            <script src="timeline.js"></script>
         </main>
   </fluent-provider>
</body>

</html>
